<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resources</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script>kirRequireAuth();</script>
<script src="js/admin-shared.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tailwind-output.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin-shared.css">
</head>

<body class="min-h-screen antialiased relative overflow-x-hidden">

<div class="glow-layer">
  <div class="glow-blob w-[500px] h-[500px] bg-accent-25 -top-40 -left-40"></div>
  <div class="glow-blob w-[400px] h-[400px] bg-accent-10 top-1/3 -right-32"></div>
  <div class="glow-blob w-[350px] h-[350px] bg-accent-10 bottom-0 left-1/4"></div>
</div>

<div class="relative z-10 min-h-screen lg:flex kir-app-shell">

  <div class="lg:hidden flex items-center justify-between px-4 py-3 glass border-x-0 border-t-0 sticky top-0 z-20">
    <button onclick="kirToggleMobileSidebar()" class="text-zinc-300 p-2 -ml-2" aria-label="Menu">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <button onclick="kirOpenProfileModal()" class="flex items-center justify-center p-1" aria-label="Profil">
      <div data-kir="avatar" class="w-8 h-8 rounded-full bg-white/10 text-zinc-300 flex items-center justify-center font-display font-semibold text-xs shrink-0 hover:brightness-110 transition shadow-sm"></div>
    </button>
  </div>

  <div id="sidebar-root"></div>

  <main class="flex-1 min-w-0 px-4 sm:px-8 py-8 max-w-6xl w-full mx-auto">
    <div class="mb-7">
      <h1 class="font-display text-2xl sm:text-3xl font-semibold tracking-tight" data-i18n="resources">Resources</h1>
      <p class="text-zinc-500 text-sm mt-1" data-i18n="resources_desc">Kursus yang tersedia untuk diikuti anggota ekstrakurikuler.</p>
    </div>

    <!-- Search and Filters -->
    <div class="mb-6">
      <div class="relative mb-4">
        <input type="text" id="resource-search-input" placeholder="Search courses…" class="glass-input w-full rounded-lg pl-10 pr-9 py-3 text-sm" data-i18n-placeholder="resources_search_placeholder" />
        <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
        <button type="button" id="resource-search-input-clear" class="hidden absolute right-3 top-1/2 transform -translate-y-1/2 text-zinc-500 hover:text-zinc-300 transition" aria-label="Clear search">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto pb-2">
        <button onclick="toggleCabangFilter('robotik')" id="filter-robotik" class="px-3 py-1.5 text-xs font-medium rounded-lg badge-robotik transition" data-i18n="robotik">Robotik</button>
        <button onclick="toggleCabangFilter('sains')" id="filter-sains" class="px-3 py-1.5 text-xs font-medium rounded-lg badge-sains transition" data-i18n="sains">Sains</button>
      </div>
    </div>

    <div id="resources-grid" class="grid sm:grid-cols-2 gap-5"><!-- filled by script below --></div>
  </main>
</div>

<!-- Resource detail modal -->
<div id="resource-modal" class="modal-overlay hidden" onclick="if(event.target===this) closeResourceModal()">
  <div class="modal-card p-0">
    <div id="resource-modal-image-wrap" class="hidden rounded-t-2xl overflow-hidden">
      <img id="resource-modal-image" class="w-full h-48 sm:h-56 object-cover" alt="" />
    </div>
    <div class="p-6">
      <div class="flex items-start justify-between gap-4 mb-1">
        <h2 id="resource-modal-title" class="font-display text-lg font-semibold"></h2>
        <div class="flex items-center gap-1.5 shrink-0 -mt-1 -mr-1">
          <div id="resource-modal-admin-actions" class="flex items-center gap-1.5"></div>
          <button onclick="closeResourceModal()" class="text-zinc-500 hover:text-zinc-300 p-1">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
      </div>
      <div class="glass rounded-lg p-4 mt-3 mb-5">
        <p id="resource-modal-desc" class="text-sm text-zinc-300 leading-relaxed"></p>
      </div>
      <button id="resource-modal-action" class="px-5 py-2.5 rounded-lg font-semibold text-sm text-white bg-accent-gradient hover:brightness-110 shadow-glow-sm transition"></button>
    </div>
  </div>
</div>

<script>
  let RESOURCES = [];

  async function fetchResourcesFromDatabase() {
    const { data, error } = await supabaseClient
      .from('resources')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Error fetching resources:', error);
      return;
    }

    RESOURCES = data || [];
    renderResources();
  }

  let activeCabangFilters = new Set(['robotik', 'sains']);
  let currentSearch = '';

  // Clicking a resource card is how a member picks which course to take
  // on course.html. `resource_url` doubles as the target course's id
  // here (see the "ID Kursus" admin field below); a resource with
  // nothing set there has no course to load, so we just no-op.
  //
  // Picking a course also *enrolls* the member in it (course_enrollments
  // table) — that's what makes it "taken": course.html reads this table
  // to know which course to open and where the member left off, per
  // account rather than per browser. KIR_LAST_COURSE_KEY is kept only as
  // a same-browser fallback for the instant after enrolling, in case the
  // write hasn't replicated by the time course.html's own read happens.
  const KIR_LAST_COURSE_KEY = 'kir_last_course_id';

  async function loadCourseFromResource(id) {
    const m = RESOURCES.find(x => x.id === id);
    if (!m || !m.resource_url) return;
    localStorage.setItem(KIR_LAST_COURSE_KEY, m.resource_url);
    await kirEnrollInCourse(m.resource_url);
    window.location.href = 'course.html';
  }

  // Creates a course_enrollments row for (member, course) the first
  // time they take it; if they already have one (re-taking a course
  // they started before), this only bumps updated_at so it becomes
  // their most-recently-taken course again — it never resets their
  // saved progress (current_node_id / completed_node_ids), which
  // course.html owns from here on.
  async function kirEnrollInCourse(courseId) {
    const { data: userData } = await supabaseClient.auth.getUser();
    const uid = userData?.user?.id;
    if (!uid) return;

    const { data: existing, error: errExisting } = await supabaseClient
      .from('course_enrollments')
      .select('id')
      .eq('user_id', uid)
      .eq('course_id', courseId)
      .limit(1);

    if (errExisting) { console.error('Error checking course enrollment:', errExisting); return; }

    if (existing && existing.length) {
      const { error: errTouch } = await supabaseClient
        .from('course_enrollments')
        .update({ updated_at: new Date().toISOString() })
        .eq('id', existing[0].id);
      if (errTouch) console.error('Error updating course enrollment:', errTouch);
    } else {
      const { error: errInsert } = await supabaseClient
        .from('course_enrollments')
        .insert({ user_id: uid, course_id: courseId });
      if (errInsert) console.error('Error enrolling in course:', errInsert);
    }
  }

  function renderResources() {
    const filtered = RESOURCES.filter(m => {
      const matchesCabang = activeCabangFilters.has(m.cabang) || (m.cabang === 'both' && activeCabangFilters.size > 0);
      const matchesSearch = currentSearch === '' || m.title.toLowerCase().includes(currentSearch.toLowerCase()) || (m.description || '').toLowerCase().includes(currentSearch.toLowerCase());
      return matchesCabang && matchesSearch;
    });

    document.getElementById('resources-grid').innerHTML = filtered.length ? filtered.map((m, i) => {
      const cardHtml = `
      <div onclick="openResourceModal('${m.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openResourceModal('${m.id}');}" tabindex="0" role="button" style="animation-delay: ${i * 45}ms" class="glass rounded-xl p-5 relative overflow-hidden border border-accent-30 animate-stagger-in cursor-pointer hover:bg-white/5 transition group">
        ${m.image_url ? `<div class="item-thumb-slot"><img src="${m.image_url}" alt="" /></div>` : ''}
        <div class="relative z-10">
          <h3 class="font-display font-semibold text-lg text-zinc-100 mb-2">${m.title}</h3>
          <p class="text-zinc-400 text-sm mb-4">${m.description || ''}</p>
          <button onclick="event.stopPropagation(); loadCourseFromResource('${m.id}')" class="px-4 py-2 rounded-lg bg-white/10 text-sm font-medium hover:bg-white/20 transition">${m.actionlabel || 'Dapatkan Kursus'}</button>
        </div>
      </div>`;

      return kirAdminWrapQuickActions(cardHtml, {
        onEdit: `openResourceAdminModal('${m.id}')`,
        onDelete: `confirmDeleteResource('${m.id}')`
      });
    }).join('') : `
      <div class="col-span-1 sm:col-span-2 glass rounded-xl p-8 text-center flex flex-col items-center justify-center animate-stagger-in">
        <svg class="w-12 h-12 text-zinc-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
        <p class="text-zinc-300 font-medium mb-1" data-i18n="empty_resources_title">Belum ada kursus di sini!</p>
        <p class="text-zinc-500 text-sm" data-i18n="empty_resources_desc">Pengurus belum mengunggah kursus. Mohon bersabar, ya!</p>
      </div>`;
    kirApplyTranslations();
  }

  function toggleCabangFilter(cabang) {
    if (activeCabangFilters.has(cabang)) {
      activeCabangFilters.delete(cabang);
    } else {
      activeCabangFilters.add(cabang);
    }
    ['robotik', 'sains'].forEach(c => {
      const btn = document.getElementById(`filter-${c}`);
      if (btn) btn.classList.toggle('opacity-50', !activeCabangFilters.has(c));
    });
    renderResources();
  }

  let resourceSearchDebounce = null;
  document.getElementById('resource-search-input')?.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    clearTimeout(resourceSearchDebounce);
    resourceSearchDebounce = setTimeout(renderResources, 150);
  });

  let currentResourceId = null;

  function openResourceModal(id) {
    const m = RESOURCES.find(x => x.id === id);
    if (!m) return;
    currentResourceId = id;
    document.getElementById('resource-modal-admin-actions').innerHTML = kirAdminActionsHtml({
      onEdit: `openResourceAdminModal('${m.id}')`,
      onDelete: `confirmDeleteResource('${m.id}')`,
      closeExpr: `closeResourceModal()`
    });
    document.getElementById('resource-modal-title').textContent = m.title;
    document.getElementById('resource-modal-desc').textContent = m.description || m.desc || '';
    document.getElementById('resource-modal-action').textContent = m.actionlabel || 'Buka Materi';
    document.getElementById('resource-modal-action').onclick = () => loadCourseFromResource(m.id);
    const imgWrap = document.getElementById('resource-modal-image-wrap');
    const img = document.getElementById('resource-modal-image');
    if (m.image_url) { img.src = m.image_url; imgWrap.classList.remove('hidden'); }
    else { imgWrap.classList.add('hidden'); }
    kirModalShow(document.getElementById('resource-modal'));
  }

  function closeResourceModal() {
    kirModalHide(document.getElementById('resource-modal'));
    currentResourceId = null;
  }

  function resourceAdminFields() {
    return [
      { id: 'title', label: 'Judul', type: 'text', required: true },
      { id: 'description', label: 'Deskripsi', type: 'textarea', rows: 4, required: true },
      { id: 'cabang', label: 'Cabang', type: 'select', required: true, row: 'meta', options: [
        { value: 'robotik', label: 'Robotik' },
        { value: 'sains', label: 'Sains' },
        { value: 'both', label: 'Keduanya' },
      ] },
      { id: 'actionlabel', label: 'Label Tombol', type: 'text', placeholder: 'Buka Materi', row: 'meta' },
      // Maps to the `resource_url` column. This is what gets loaded into
      // course.html when a member picks this course — see
      // loadCourseFromResource() above.
      { id: 'resource_url', label: 'ID Kursus', type: 'text', placeholder: 'mis. course-robotik-1', row: 'meta' },
      { id: 'image_url', label: 'URL Gambar', type: 'image' },
    ];
  }

  function openResourceAdminModal(id) {
    const resource = id ? RESOURCES.find(m => m.id === id) : null;
    kirOpenAdminModal({
      title: resource ? 'Edit Kursus' : 'Tambah Kursus',
      size: 'wide',
      fields: resourceAdminFields(),
      values: resource,
      saveLabel: resource ? 'Simpan' : 'Tambah',
      onSave: async (payload) => {
        const result = resource
          ? await kirAdminUpdate('resources', resource.id, payload)
          : await kirAdminCreate('resources', payload);
        if (!result.success) throw new Error(result.error);
        await fetchResourcesFromDatabase();
        if (resource && currentResourceId === resource.id) closeResourceModal();
      }
    });
  }

  function confirmDeleteResource(id) {
    const resource = RESOURCES.find(m => m.id === id);
    kirConfirmDialog({
      title: 'Hapus kursus ini?',
      message: resource ? `"${resource.title}" akan dihapus permanen.` : 'Kursus ini akan dihapus permanen.',
      onConfirm: async () => {
        const result = await kirAdminDelete('resources', id);
        if (!result.success) throw new Error(result.error);
        if (currentResourceId === id) closeResourceModal();
        await fetchResourcesFromDatabase();
      }
    });
  }

  kirRenderAdminFab({ onClick: () => openResourceAdminModal(null) });

  kirInjectSidebar('resources');
  fetchResourcesFromDatabase();
</script>
<script>
  // Search bar UX: the "×" clear button, plus letting someone start
  // typing anywhere on the page and have it land in the search box
  // without clicking into it first. Self-contained per page — see
  // router.js's note on why a document-level keydown listener needs
  // its own explicit kir:teardown cleanup here.
  (function () {
    const input = document.getElementById('resource-search-input');
    const clearBtn = document.getElementById('resource-search-input-clear');
    if (!input || !clearBtn) return;

    function updateClearBtn() {
      clearBtn.classList.toggle('hidden', input.value.length === 0);
    }
    updateClearBtn();
    input.addEventListener('input', updateClearBtn);

    clearBtn.addEventListener('click', () => {
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.focus();
    });

    function onKeydown(e) {
      if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable)) return;
      if (document.querySelector('.modal-overlay:not(.hidden)')) return;
      input.focus();
    }
    document.addEventListener('keydown', onKeydown);
    window.addEventListener('kir:teardown', () => {
      document.removeEventListener('keydown', onKeydown);
    }, { once: true });
  })();
</script>
<script src="js/router.js"></script>
</body>
</html>
