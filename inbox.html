<!DOCTYPE html>
<html lang="id">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://code.jquery.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://i.imgur.com; connect-src 'self' https://qalkibuywgookvicnuhv.supabase.co https://candaan-api.vercel.app https://tanggalmerah.upset.dev https://www.google-analytics.com https://api.adviceslip.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://docs.google.com https://forms.gle; object-src 'none'; base-uri 'self'; form-action 'self' https://docs.google.com https://forms.gle; frame-ancestors 'none'; upgrade-insecure-requests">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tailwind-output.css" />
<link rel="stylesheet" href="css/style.css" />

<!-- Supabase client must load before auth.js, which reads window.supabase
     at parse time to set up window.supabaseClient. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- auth.js's applyThemeImmediately() IIFE runs the instant this parses,
     so theme/lang/cabang are applied before anything paints. -->
<script src="js/auth.js"></script>
<script>
  kirRequireAuth().then(() => {
    if (typeof kirIsAdmin === 'function' && !kirIsAdmin()) {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</head>
<body class="min-h-screen antialiased relative overflow-x-hidden">

  <div class="glow-layer">
    <div class="glow-blob w-[500px] h-[500px] bg-accent-25 -top-40 -left-40"></div>
    <div class="glow-blob w-[400px] h-[400px] bg-accent-10 top-1/3 -right-32"></div>
    <div class="glow-blob w-[350px] h-[350px] bg-accent-10 bottom-0 left-1/4"></div>
  </div>

  <div class="relative z-10 min-h-screen lg:flex kir-app-shell">

    <div class="lg:hidden flex items-center justify-between px-4 py-3 glass border-x-0 border-t-0 sticky top-0 z-20">
    <button onclick="kirToggleMobileSidebar()" class="text-zinc-300 p-2 -ml-2" aria-label="Menu">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <button onclick="kirOpenProfileModal()" class="flex items-center justify-center p-1" aria-label="Profil">
      <div data-kir="avatar" class="w-8 h-8 rounded-full bg-white/10 text-zinc-300 flex items-center justify-center font-display font-semibold text-xs shrink-0 hover:brightness-110 transition shadow-sm"></div>
    </button>
  </div>

    <!-- kirInjectSidebar('inbox') below fills this in, and keeps the
         Inbox nav link's `.active` state in sync with data-tab. -->
    <div id="sidebar-root"></div>

    <main class="flex-1 min-w-0 px-4 sm:px-8 py-8 max-w-4xl w-full mx-auto">
      <div class="mb-6 flex items-start justify-between gap-4 flex-wrap">
        <div>
          <h1 class="font-display text-2xl sm:text-3xl font-semibold tracking-tight" data-i18n="inbox">Kotak Masuk</h1>
          <div class="flex items-center gap-2.5 mt-1 flex-wrap">
            <p class="text-zinc-500 text-sm" data-i18n="inbox_desc">Pesan dan pemberitahuan kamu.</p>
            <span class="inline-flex items-center text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400" data-i18n="wip_badge">Segera Hadir</span>
          </div>
        </div>
        <!-- Same secondary glass button used for dashboard's Edit action;
             disabled the same way dashboard.html dims its undo/redo
             buttons (inline opacity + not-allowed cursor) rather than
             inventing a new disabled style, since there's nothing to mark
             once everything's already read. -->
        <button id="inbox-mark-all-btn" onclick="kirInboxMarkAllRead()" class="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium glass hover:bg-white/10 transition shrink-0">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
          <span data-i18n="inbox_mark_all_read">Tandai Semua Dibaca</span>
        </button>
      </div>

      <!-- Filter pills: same active/inactive treatment as the type filter
           in tasks.html (accent-15 fill + accent-30 border, opacity-50
           when not selected) rather than a new pill style. -->
      <div class="flex items-center gap-2 mb-6">
        <button onclick="kirInboxSetFilter('all')" id="inbox-filter-all" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-accent-15 text-accent-300 border border-accent-30 transition" data-i18n="inbox_filter_all">Semua</button>
        <button onclick="kirInboxSetFilter('unread')" id="inbox-filter-unread" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-accent-15 text-accent-300 border border-accent-30 transition opacity-50" data-i18n="inbox_filter_unread">Belum Dibaca</button>
      </div>

      <!-- Rendered by renderInbox() below. Still placeholder data — nothing
           here is wired to a real messages table yet — but now driven
           through a small in-memory array instead of hardcoded markup, so
           filtering / read state / mark-all-read all work off one source
           of truth. Rows keep reusing the same .kir-inbox-row/.kir-inbox-
           avatar/.kir-inbox-dot styles from css/style.css. -->
      <div id="inbox-list" class="glass rounded-2xl p-3 lg:p-4 animate-stagger-in">
        <div id="inbox-list-rows" class="space-y-1"></div>
      </div>
    </main>

  </div>

<script src="js/router.js"></script>
<script>
  /* Placeholder inbox data — see the comment above #inbox-list. Ordered
     newest-first so it reads like a real notification feed. */
  let INBOX_MESSAGES = [
    { id: 'm1', name: 'Rangga · Admin Panel', avatar: 'R', time: '10m', text: 'Tugas "Bab 3 - Metodologi" sudah disetujui, cek catatannya ya.', read: false },
    { id: 'm2', name: 'Sistem', avatar: 'S', time: '2j', text: 'Jadwal baru "Rapat Cabang" ditambahkan minggu ini.', read: false },
    { id: 'm3', name: 'Leaderboard', avatar: 'L', time: '3j', text: 'Kamu naik ke peringkat #4 minggu ini. Mantap!', read: true },
    { id: 'm4', name: 'Anggota', avatar: 'A', time: '5j', text: 'Ada 2 anggota baru bergabung ke cabang kamu.', read: true },
    { id: 'm5', name: 'Dina', avatar: 'D', time: 'Kemarin', text: 'Mengomentari materi "Pengantar Statistika".', read: true },
  ];

  let inboxCurrentFilter = 'all';

  function kirInboxUnreadCount() {
    return INBOX_MESSAGES.filter(m => !m.read).length;
  }

  function kirInboxSetFilter(filter) {
    inboxCurrentFilter = filter;
    renderInbox();
  }

  function kirInboxMarkRead(id) {
    const m = INBOX_MESSAGES.find(x => x.id === id);
    if (!m || m.read) return;
    m.read = true;
    renderInbox();
  }

  function kirInboxMarkAllRead() {
    if (kirInboxUnreadCount() === 0) return;
    INBOX_MESSAGES.forEach(m => m.read = true);
    renderInbox();
  }

  function buildInboxRow(m, i) {
    const avatarStyle = !m.read ? ` style="background:rgba(var(--accent-rgb),0.18); color:var(--text-color);"` : '';
    return `
      <div onclick="kirInboxMarkRead('${m.id}')" style="animation-delay: ${i * 30}ms" class="kir-inbox-row${!m.read ? ' kir-inbox-unread' : ''} animate-stagger-in">
        <div class="kir-inbox-avatar"${avatarStyle}>${kirEscapeHtml(m.avatar)}</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <p class="text-sm font-medium truncate">${kirEscapeHtml(m.name)}</p>
            <span class="text-[11px] text-zinc-500 shrink-0">${kirEscapeHtml(m.time)}</span>
          </div>
          <p class="text-xs text-zinc-500 truncate mt-0.5">${kirEscapeHtml(m.text)}</p>
        </div>
        ${!m.read ? '<span class="kir-inbox-dot"></span>' : ''}
      </div>`;
  }

  function renderInbox() {
    const lang = localStorage.getItem(KIR_LANG_KEY) || 'id';
    const t = I18N[lang];
    const unread = kirInboxUnreadCount();

    // Filter pill active/inactive state — same opacity toggle pattern
    // tasks.html uses for its type filter buttons.
    document.getElementById('inbox-filter-all').classList.toggle('opacity-50', inboxCurrentFilter !== 'all');
    document.getElementById('inbox-filter-unread').classList.toggle('opacity-50', inboxCurrentFilter !== 'unread');
    document.getElementById('inbox-filter-unread').textContent = unread > 0
      ? `${t.inbox_filter_unread} (${unread})`
      : t.inbox_filter_unread;

    // Mark-all-read button: dimmed + inert once there's nothing left to
    // mark, same inline-style disabled treatment dashboard.html uses for
    // its undo/redo buttons rather than a new disabled style.
    const markAllBtn = document.getElementById('inbox-mark-all-btn');
    markAllBtn.disabled = unread === 0;
    markAllBtn.style.opacity = unread === 0 ? '0.45' : '1';
    markAllBtn.style.cursor = unread === 0 ? 'not-allowed' : 'pointer';
    markAllBtn.style.pointerEvents = unread === 0 ? 'none' : 'auto';

    // Keep the sidebar's inbox badge (#sidebar-inbox-badge, injected by
    // kirInjectSidebar) in sync with real unread state instead of leaving
    // it on its hardcoded placeholder count.
    const sidebarBadge = document.getElementById('sidebar-inbox-badge');
    if (sidebarBadge) {
      sidebarBadge.textContent = unread;
      sidebarBadge.classList.toggle('hidden', unread === 0);
    }

    const filtered = inboxCurrentFilter === 'unread' ? INBOX_MESSAGES.filter(m => !m.read) : INBOX_MESSAGES;
    const rows = document.getElementById('inbox-list-rows');

    if (filtered.length === 0) {
      const isUnreadFilter = inboxCurrentFilter === 'unread';
      rows.innerHTML = `
        <div class="p-8 text-center flex flex-col items-center justify-center">
          <svg class="w-12 h-12 text-zinc-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
          <p class="text-zinc-300 font-medium mb-1">${isUnreadFilter ? t.inbox_empty_unread_title : t.inbox_empty_title}</p>
          <p class="text-zinc-500 text-sm">${isUnreadFilter ? t.inbox_empty_unread_desc : t.inbox_empty}</p>
        </div>`;
      return;
    }

    rows.innerHTML = filtered.map(buildInboxRow).join('');
  }

  kirInjectSidebar('inbox');
  renderInbox();
</script>
</body>
</html>
